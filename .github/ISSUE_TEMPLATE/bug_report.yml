name: Bug report
description: tvprobe or tvcast misbehaves on a TV that is otherwise supported.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full terminal output
      description: Everything tvcast or tvprobe printed. Mask anything private first.
      render: shell
    validations:
      required: true
  - type: textarea
    id: probe
    attributes:
      label: tvprobe --report output
      render: json
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: TV model, Mac model, macOS version, ffmpeg version, tvcast commit
    validations:
      required: true
